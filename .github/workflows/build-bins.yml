name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          mkdir -p release
          BINARY="kagi-proxy"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BINARY="${BINARY}.exe"
          fi
          cp "target/${{ matrix.target }}/release/${BINARY}" "./release/kagi-proxy-${{ matrix.arch }}"
          tar -czvf "kagi-proxy-${{ matrix.arch }}.tar.gz" -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kagi-proxy-${{ matrix.arch }}
          path: kagi-proxy-${{ matrix.arch }}.tar.gz

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
