[package]
name = "kagi-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["macros", "json", "tokio", "http1", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
hyper = { version = "1", features = ["full"] }
http-body = "0.4"
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"