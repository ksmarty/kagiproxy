version: "3.8"

services:
  kagi-proxy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - KAGI_BASE_URL=${KAGI_BASE_URL:-https://kagi.com}
      - KAGI_SESSION_TOKEN=${KAGI_SESSION_TOKEN:-}
      - KAGI_AUTH_HEADER=${KAGI_AUTH_HEADER:-}
      - PORT=${PORT:-3000}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3